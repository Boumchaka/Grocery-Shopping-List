<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Générateur V2.3</title><style>body{font-family:system-ui;max-width:720px;margin:40px auto;padding:20px;background:#f5f3ed}main{background:#fff;padding:24px;border-radius:16px}button,input{font:inherit;padding:12px;margin:8px 0}button{background:#176f4a;color:#fff;border:0;border-radius:10px;font-weight:700}.ok{color:#176f4a}.err{color:#8c201c}</style></head><body><main><h1>Générateur Liste de courses V2.3</h1><p>Sélectionnez votre fichier V2.2. Le fichier corrigé <b>index.html</b> sera téléchargé automatiquement.</p><input id="file" type="file" accept=".html,text/html"><br><button id="go">Créer la V2.3</button><p id="msg"></p></main><script>
const msg=document.getElementById('msg');
document.getElementById('go').onclick=async()=>{try{const f=document.getElementById('file').files[0];if(!f)throw new Error('Sélectionnez d’abord le fichier HTML V2.2.');let s=await f.text();if(!s.includes('grocerySeasonV22')||!s.includes('cloudState()'))throw new Error('Ce fichier ne semble pas être la V2.2 attendue.');s=s.replaceAll('Liste de courses de saison V2.2','Liste de courses de saison V2.3').replaceAll('>V2.2</small>','>V2.3</small>');s=s.replace("key:'grocerySeasonV22',legacyKey:'grocerySeasonV21'","key:'grocerySeasonV23',legacyKey:'grocerySeasonV22'");s=s.replace("cloudState(){let copy=structuredClone(App.state);delete copy.visible;return copy}","cloudState(){let copy=structuredClone(App.state);delete copy.visible;return JSON.stringify(copy)}");s=s.replace("async load(){let local=this.local()||this.empty();this.status('☁ Connexion…','busy');try{let snap=await cloudRef.get();if(snap.exists&&snap.data().state){let visible=local.visible||mondayISO(new Date());let state=snap.data().state;state.visible=visible;this.status('☁ Synchronisé','ok');return state}await cloudRef.set({state:(()=>{let x=structuredClone(local);delete x.visible;return x})(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});this.status('☁ Synchronisé','ok');return local}catch(e){console.error('Chargement Firestore impossible',e);this.status('☁ Hors ligne','error');return local}},","async load(){let local=this.local()||this.empty();this.status('☁ Connexion…','busy');try{let snap=await cloudRef.get(),raw=snap.exists?snap.data().state:null;if(typeof raw==='string'){let visible=local.visible||mondayISO(new Date()),state=JSON.parse(raw);state.visible=visible;this.status('☁ Synchronisé','ok');return state}await cloudRef.set({state:(()=>{let x=structuredClone(local);delete x.visible;return JSON.stringify(x)})(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});this.status('☁ Synchronisé','ok');return local}catch(e){console.error('Chargement Firestore impossible',e);this.status('☁ Hors ligne','error');return local}},");s=s.replace("let remote=snap.data().state;if(!remote||!App.state)return;let visible=App.state.visible;let incoming=structuredClone(remote);incoming.visible=visible;","let raw=snap.data().state;if(typeof raw!=='string'||!App.state)return;let visible=App.state.visible,incoming;try{incoming=JSON.parse(raw)}catch(e){console.error('JSON Firestore illisible',e);this.status('☁ Données invalides','error');return}incoming.visible=visible;");if(!s.includes('return JSON.stringify(copy)')||!s.includes("JSON.parse(raw)"))throw new Error('La conversion n’a pas pu être vérifiée.');const b=new Blob([s],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';a.click();URL.revokeObjectURL(a.href);msg.className='ok';msg.textContent='V2.3 créée. Le fichier index.html a été téléchargé.'}catch(e){msg.className='err';msg.textContent=e.message}};
</script></body></html>
