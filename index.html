function renderPlan(){let d=vis(),w=ensure(),s=w.base.split(' ')[0];hero.innerHTML=`<div class="hero ${s}"><div class="row"><h1>${SICON[s]} ${w.base}</h1><span class="pill">📅 ${range(d)}</span></div><div class="resetline"><button class="btn" onpointerdown="holdReset()" onpointerup="clearTimeout(timer)">Reset</button></div><p>Aujourd’hui : ${fmt(new Date())}</p><div class="row"><span class="pill" onpointerdown="holdDefault()">👥 Portion défaut : ${st.portion}</span><span class="pill">✓ Semaine sauvegardée</span></div><div class="row"><button class="btn" onclick="move(-1)">← Précédente</button><button class="btn primary" onclick="goToday()">Aujourd’hui</button><button class="btn" onclick="move(1)">Suivante →</button></div></div>`;planner.innerHTML=days.map((d,di)=>`<article class="day"><h3>${d}</h3><div class="meals">${[0,1].map(mi=>meal(di*2+mi,mi?'Soir':'Midi')).join('')}</div></article>`).join('')}
function meal(i,label){let n=actual(i),r=n==='RepasLibre'?null:R(n),p=ensure().portions[i]??st.portion;return `<div class="meal" onpointerdown="holdMeal(${i},false)" onpointerup="clearTimeout(timer)" onclick="clickMeal(${i})"><small>${label}</small><div class="name">${r?ICON[r.c]+' '+n:'🍽️ RepasLibre'}</div><div class="bottom"><b>${r?eur(recipeCost(n,p)):'-'}</b><button class="portion" onclick="event.stopPropagation();editPortion(${i})">👥 ${r?p:0}</button></div></div>`}

function openRecipe(n,p){let r=R(n);sheet.innerHTML=`<h2>${ICON[r.c]} ${n}</h2><p>⏱️ ${r.t} min · ${eur(recipeCost(n,p))}</p><h3>Ingrédients pour ${p} personnes</h3><ul>${r.i.map(x=>`<li><b>${Math.round(x[1]*p*10)/10} ${x[2]}</b> de ${x[0]}</li>`).join('')}</ul><p><i>Procédure détaillée à intégrer après validation des fiches.</i></p>`;openM()}

function renderCourses(){let d=vis(),w=ensure(),gs={},total=0;aggregate().forEach(x=>{let f=factor(x.a);if(!f)return;x.buy=x.q*f;x.cost=unitCost(x.a,x.buy,x.u);total+=x.cost;(gs[x.g]??=[]).push(x)});let manual=st.manual[wk()]||[];manual.forEach((x,i)=>(gs['Ajouts manuels']??=[]).push({manual:true,a:x.name,manualIndex:i,cost:0}));courseHead.innerHTML=`<div class="hero ${w.base.split(' ')[0]}"><h2>${SICON[w.base.split(' ')[0]]} ${w.base}</h2><b>📅 ${range(d)}</b><h2>Total estimé : ${eur(total)}</h2><div class="notice">Les ajouts manuels sont enregistrés uniquement pour cette semaine datée et exclus du prix estimé.</div></div>`;courseList.innerHTML=Object.entries(gs).map(([g,a])=>{let sub=a.reduce((s,x)=>s+(x.manual?0:x.cost),0);return `<div class="shop ${g==='Ajouts manuels'?'manual':''}"><h3>${g}</h3>${a.map(x=>{let ck=wk()+'|'+g+'|'+x.a;if(x.manual)return `<div class="shoprow"><input type="checkbox" ${st.checks[ck]?'checked':''} onchange="st.checks['${ck.replaceAll("'","\\'")}']=this.checked;save()"><div><b>${x.a}</b></div><div><button class="del" onclick="delManual(${x.manualIndex})">×</button></div></div>`;return `<div class="shoprow"><input type="checkbox" ${st.checks[ck]?'checked':''} onchange="st.checks['${ck.replaceAll("'","\\'")}']=this.checked;save()"><div><b>${x.a} : ${qtyText(x.buy,x.u)}</b><div class="muted">${priceRef(x.a)}${st.stock[x.a]==='partial'?' · quantité à vérifier':''}</div></div><div><b>${eur(x.cost)}</b></div></div>`}).join('')}${g==='Ajouts manuels'?'<p class="muted">Non inclus dans le total estimé.</p>':`<p class="subtotal">Sous-total : ${eur(sub)}</p>`}</div>`}).join('')}
