<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Liste de courses de saison V4.6</title><link rel="stylesheet" href="styles.css?v=4.6"></head><body><header><div class="brand">🥕 Liste de courses de saison <small style="font-weight:500">V4.6</small><span id="syncStatus" class="sync-status busy">☁ Connexion…</span></div><nav class="tabs" id="tabs"></nav></header><main>
<section id="planning" class="page"><div id="planningHero"></div><div id="planningGrid" class="grid"></div></section>
<section id="courses" class="page hidden"><div class="page-head"><h1>🛒 Courses</h1><button class="btn primary" onclick="UI.addManual()">+ Ajouter</button></div><div id="courseHero"></div><div id="courseList"></div></section>
<section id="stock" class="page hidden"><h1>Stock fréquent</h1><div id="stockList" class="grid"></div></section>
<section id="recipes" class="page hidden"><div class="page-head"><h1>Recettes</h1><button class="btn primary" onclick="UI.addRecipe()">+ Ajouter</button></div><div class="recipe-filters"><div class="filter-search"><input id="recipeSearch" placeholder="Rechercher une recette"></div><div id="categoryFilters" class="filter-row" aria-label="Filtrer par catégorie"></div><div id="seasonFilters" class="filter-row" aria-label="Filtrer par saison"></div></div><div id="recipeList" class="grid"></div></section>
<section id="prices" class="page hidden"><h1>Prix des ingrédients</h1><input id="priceSearch" placeholder="🔍 Rechercher"><div id="priceList" class="grid"></div></section>
</main><div id="modal" class="modal hidden" onclick="if(event.target===this)UI.close()"><div id="sheet" class="sheet"></div></div>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js?v=4.6"></script></body></html>
